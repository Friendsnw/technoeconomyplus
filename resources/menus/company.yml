# ==[ TECHNOECONOMYPLUS - COMPANY MANAGEMENT MENU ]=====
# EN: DeluxeMenus-style interface for enterprise management, payroll, tax settlement, and valuation.
# EN: Placeholders integrate with company registration, treasury, workforce, and stock market valuation.
# TR: Şirket yönetimi, maaş ödemeleri, vergi ödemesi ve piyasa değeri için DeluxeMenus arayüzü.
# TR: Yer tutucular şirket kuruluşu, kasa, çalışan kadrosu ve borsa piyasa değeri ile entegredir.
# FR: Interface DeluxeMenus pour la gestion d'entreprise, paie, règlement fiscal et valorisation.
# FR: Les placeholders s'intègrent à la trésorerie, la main-d'œuvre et la valorisation boursière.
# DE: DeluxeMenus-Interface für Unternehmensverwaltung, Gehaltsabrechnung, Steuern und Bewertung.
# DE: Platzhalter integrieren Firmengründung, Kasse, Mitarbeiter und Börsenbewertung.

# EN: Title displayed at the top of the GUI inventory / TR: Menü başlığı / FR: Titre du menu / DE: Menütitel
menu_title: "&8&lCompany &7- &fManagement Panel"

# EN: Inventory size in slots (multiple of 9: 9, 18, 27, 36, 45, 54) / TR: Envanter boyutu / FR: Taille de l'inventaire / DE: Inventargröße
size: 54

items:
  # ==[ BACKGROUND FILLER ]=====
  # EN: Decorative border pane / TR: Dekoratif çerçeve camı / FR: Vitre décorative de bordure / DE: Dekorative Randglasscheibe
  background:
    material: BLACK_STAINED_GLASS_PANE
    display_name: " "
    slots: [0,1,2,3,4,5,6,7,8,45,46,47,48,49,50,51,52,53]

  # ==[ HEADER / OVERVIEW ]=====
  # EN: Overview banner for company management / TR: Şirket yönetim paneli başlığı / FR: Bannière de gestion d'entreprise / DE: Übersichtsbanner für Unternehmensverwaltung
  header:
    material: EMERALD
    display_name: "&a&lCompany Management"
    lore:
      - "&7Manage enterprise finances, employees, and taxes."
    slot: 4

  # ==[ COMPANY STATS & INFO ]=====
  # EN: Real-time company financial report and metrics / TR: Anlık şirket finansal raporu ve göstergeleri / FR: Rapport financier et indicateurs en temps réel / DE: Echtzeit-Finanzbericht und Unternehmenskennzahlen
  company_info:
    material: PAPER
    display_name: "&f&lEnterprise Overview"
    lore:
      - "&7Company: &f%technoeconomy_company_name%"
      - "&7Treasury: &a%technoeconomy_company_balance%"
      - "&7Tax Debt: &c%technoeconomy_company_tax_debt%"
      - "&7Market Valuation: &e%technoeconomy_company_market_cap%"
      - "&7Employee Count: &b%technoeconomy_company_workers%"
    slot: 20

  # ==[ DEPOSIT TO TREASURY ]=====
  # EN: Add funds to company treasury / TR: Şirket kasasına para yatır / FR: Déposer des fonds dans la trésorerie / DE: Geld in die Firmenkasse einzahlen
  deposit:
    material: GOLD_INGOT
    display_name: "&e&lDeposit Funds"
    lore:
      - "&7Deposit money into company vault:"
      - "&7/company deposit <amount>"
    slot: 21
    click_commands:
      - "[message] &eType /company deposit <amount> to add capital."

  # ==[ WITHDRAW FROM TREASURY ]=====
  # EN: Withdraw funds from company treasury / TR: Şirket kasasından para çek / FR: Retirer des fonds de la trésorerie / DE: Geld aus der Firmenkasse abheben
  withdraw:
    material: EMERALD
    display_name: "&a&lWithdraw Funds"
    lore:
      - "&7Withdraw funds from company vault:"
      - "&7/company withdraw <amount>"
    slot: 23
    click_commands:
      - "[message] &eType /company withdraw <amount> to withdraw capital."

  # ==[ PAY CORPORATE TAX ]=====
  # EN: Settle outstanding corporate tax obligations / TR: Bekleyen şirket vergi borcunu öde / FR: Régler les obligations fiscales en cours / DE: Ausstehende Unternehmenssteuern begleichen
  pay_tax:
    material: BOOK
    display_name: "&c&lPay Corporate Tax"
    lore:
      - "&7Current Tax Due: &c%technoeconomy_company_tax_debt%"
      - "&eClick to pay all outstanding tax liabilities."
    slot: 22
    click_commands:
      - "[player] company paytax"

  # ==[ WORKFORCE & EMPLOYEES ]=====
  # EN: Employee roster and payroll commands / TR: Çalışan kadrosu ve maaş komutları / FR: Liste des employés et commandes de paie / DE: Mitarbeiterliste und Gehaltsbefehle
  workers:
    material: PLAYER_HEAD
    display_name: "&b&lWorkforce & Payroll"
    lore:
      - "&7Active Workers: &f%technoeconomy_company_workers%"
      - ""
      - "&7Hire: &e/company hire <player> <salary>"
      - "&7Fire: &c/company fire <player>"
    slot: 31

  # ==[ CLOSE BUTTON ]=====
  # EN: Closes the company inventory / TR: Menüyü kapatır / FR: Ferme l'inventaire / DE: Schließt das Inventar
  close:
    material: BARRIER
    display_name: "&c&lClose"
    slot: 49
    click_commands:
      - "[close]"

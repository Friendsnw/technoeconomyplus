# ==[ TECHNOECONOMYPLUS - TRASH CAN MENU ]=====
# EN: DeluxeMenus-style interface for item disposal (/trash). Any items left inside when closed are permanently removed.
# TR: Eşya imha arayüzü (/trash). Menü kapatıldığında içeride bırakılan eşyalar kalıcı olarak silinir.
# FR: Interface DeluxeMenus pour la poubelle (/trash). Les objets laissés à la fermeture sont définitivement supprimés.
# DE: DeluxeMenus-Interface für den Mülleimer (/trash). Beim Schließen im Inventar verbleibende Gegenstände werden dauerhaft gelöscht.

# EN: Title displayed at the top of the GUI inventory / TR: Menü başlığı / FR: Titre du menu / DE: Menütitel

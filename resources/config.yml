# Thanks for buying our plugin >3
#
# EN: There are 3 types of memberships; for those purchased through external platforms (such as Spigot), the subscription begins at the "Large" tier, which offers the highest level of access. You can use the command `/tep license` to check your current license status.
# TR: 3 tip üyelik bulunmaktadır; Spigot gibi harici platformlardan satın alanlar için abonelik en yüksek erişim seviyesi olan "Large" paketi ile başlar. Güncel lisans durumunuzu `/tep license` komutu ile kontrol edebilirsiniz.
# FR: Il existe 3 types d'abonnements ; pour ceux achetés via des plateformes externes (comme Spigot), l'accès commence au niveau "Large", le plus élevé. Utilisez `/tep license` pour vérifier votre statut.
# DE: Es gibt 3 Mitgliedschaftsstufen; bei Käufen über externe Plattformen (wie Spigot) beginnt das Abonnement auf der höchsten Stufe "Large". Mit `/tep license` können Sie Ihren Status prüfen.
#
# Access levels:
# - Starter: Includes all basic/starting commands.
# - Standard: Includes various advanced features and commands.
# - Large: Unlocks all features and commands.
# =============

# ==[ LANGUAGE CONFIGURATION ]=====
# EN: Active plugin language. Handled via files in the /languages/ folder (en.yml, tr.yml).
# TR: Aktif eklenti dili. /languages/ klasöründeki dosyalar üzerinden yönetilir (en.yml, tr.yml).
# FR: Langue active du plugin. Gérée via les fichiers du dossier /languages/ (en.yml, tr.yml).
# DE: Aktive Plugin-Sprache. Verwaltet über die Dateien im Ordner /languages/ (en.yml, tr.yml).
language: en

# ==[ LICENSE CONFIGURATION ]=====
# EN: Enter the license key you obtained from plugins.teknodev.qzz.io.
# TR: plugins.teknodev.qzz.io üzerinden temin ettiğiniz lisans anahtarını buraya girin.
# FR: Entrez ici la clé de licence obtenue sur plugins.teknodev.qzz.io.
# DE: Geben Sie hier den Lizenzschlüssel ein, den Sie von plugins.teknodev.qzz.io erhalten haben.
license:
  key: ""

# ==[ DATABASE CONFIGURATION ]=====
# EN: Choose between remote MySQL/MariaDB or local SQLite. For large networks (100+ players), remote MySQL is strongly recommended. Local SQLite (WAL mode) is best suited for small to medium scale servers.
# TR: Uzak MySQL/MariaDB veya yerel SQLite arasında seçim yapın. Büyük sunucular (100+ oyuncu) için uzak MySQL şiddetle tavsiye edilir. Yerel SQLite (WAL modu) küçük ve orta ölçekli sunucular için uygundur.
database:
  remote:
    # EN: Enable remote MySQL database / TR: Uzak MySQL veri tabanını aktifleştir / FR: Activer MySQL distant / DE: Remote-MySQL aktivieren
    enabled: false
    # EN: Hostname or IP of the MySQL server / TR: MySQL sunucu adresi veya IP'si / FR: Hôte ou IP du serveur MySQL / DE: Hostname oder IP des MySQL-Servers
    host: "localhost"
    # EN: Port of the MySQL service (default 3306) / TR: MySQL servis portu (varsayılan 3306) / FR: Port MySQL (3306 par défaut) / DE: MySQL-Port (Standard 3306)
    port: 3306
    # EN: Database name / TR: Veri tabanı adı / FR: Nom de la base de données / DE: Name der Datenbank
    database: "technoeconomy"
    # EN: Database username / TR: Veri tabanı kullanıcı adı / FR: Nom d'utilisateur de la base / DE: Datenbank-Benutzername
    username: "root"
    # EN: Database password / TR: Veri tabanı şifresi / FR: Mot de passe de la base / DE: Datenbank-Passwort
    password: ""
    # EN: Use SSL for MySQL connections / TR: MySQL bağlantılarında SSL kullan / FR: Utiliser SSL pour les connexions MySQL / DE: SSL für MySQL-Verbindungen nutzen
    ssl: false
  local:
    # EN: SQLite database file name located in plugin folder / TR: Eklenti klasöründeki SQLite dosya adı / FR: Nom du fichier SQLite local / DE: Dateiname der SQLite-Datenbank
    file: "plugindatabase.sql"

# EN: Optional server identification key for multi-server networks / TR: Ağ sunucuları için isteğe bağlı sunucu kimlik kodu / FR: Identifiant serveur optionnel pour réseaux / DE: Optionale Server-ID für Netzwerke
server-id: ""

# ==[ PACKAGE DEFAULT TIER ]=====
# EN: Fallback tier if no license is verified (starter, standard, large)
# TR: Lisans doğrulanmadığında kullanılacak varsayılan paket (starter, standard, large)
# FR: Niveau par défaut si aucune licence n'est active (starter, standard, large)
# DE: Standard-Stufe, falls keine Lizenz verifiziert ist (starter, standard, large)
package:
  default: large

# ==[ ECONOMY CORE SETTINGS ]=====
economy:
  # EN: Initial balance given to new players joining the server / TR: Sunucuya ilk kez katılan yeni oyunculara verilen başlangıç bakiyesi / FR: Solde de départ des nouveaux joueurs / DE: Startguthaben für neue Spieler
  starting-balance: 100.0
  # EN: Currency symbol used in all economy messages and GUIs / TR: Tüm ekonomi mesajlarında ve menülerde kullanılan para birimi simgesi / FR: Symbole monétaire utilisé dans les messages et GUIs / DE: Währungssymbol für Nachrichten und GUIs
  currency-symbol: "$"

# ==[ TRANSACTION TAX SYSTEM ]=====
tax:
  # EN: Tax percentage applied when players transfer money with /pay / TR: /pay ile para transferi yapıldığında kesilen vergi yüzdesi / FR: Pourcentage de taxe prélevé lors des transferts /pay / DE: Steuersatz in Prozent bei /pay-Überweisungen
  pay-tax-percent: 2.5
  # EN: Transfers below or equal to this amount are exempt from tax / TR: Bu miktar ve altındaki transferlerden vergi kesilmez / FR: Les transferts inférieurs ou égaux à ce montant sont exonérés / DE: Beträge bis zu dieser Grenze sind steuerfrei
  pay-tax-free-minimum: 50.0

# ==[ BANK SYSTEM ]=====
bank:
  # EN: Interest rate applied to personal bank balances (e.g. 0.02 = 2%) / TR: Kişisel banka bakiyelerine uygulanan faiz oranı (örn. 0.02 = %2) / FR: Taux d'intérêt bancaire appliqué aux soldes (ex. 0.02 = 2%) / DE: Zinssatz auf Bankguthaben (z.B. 0.02 = 2%)
  interest-rate: 0.02
  # EN: Interval in minutes between interest distributions / TR: Faiz dağıtımları arasındaki süre (dakika cinsinden) / FR: Intervalle en minutes entre chaque versement d'intérêts / DE: Intervall in Minuten zwischen Zinsgutschriften
  interest-interval-minutes: 60

# ==[ DAILY REWARDS ]=====
daily:
  # EN: Base monetary reward given on day 1 of login / TR: 1. günde verilen temel günlük para ödülü / FR: Récompense de base du premier jour / DE: Basis-Belohnung an Tag 1
  base-reward: 250.0
  # EN: Extra bonus amount added for each consecutive streak day / TR: Her ardışık giriş gününde eklenen bonus miktarı / FR: Bonus ajouté pour chaque jour consécutif / DE: Zusätzlicher Bonus für jeden aufeinanderfolgenden Tag
  streak-bonus: 50.0
  # EN: Maximum streak count before resetting to day 1 / TR: Seri sıfırlanmadan önceki maksimum gün sayısı / FR: Nombre maximum de jours consécutifs avant réinitialisation / DE: Maximale Streak-Tage vor dem Zurücksetzen
  max-streak: 7

# ==[ LOTTERY SYSTEM ]=====
lottery:
  # EN: Price per single lottery ticket purchased with /lottery buy / TR: /lottery buy ile alınan tek bir piyango biletinin fiyatı / FR: Prix d'un ticket de loterie acheté avec /lottery buy / DE: Preis pro Lotterielos mit /lottery buy
  ticket-price: 20.0
  # EN: Interval in minutes between automated lottery draws / TR: Otomatik piyango çekilişleri arasındaki süre (dakika cinsinden) / FR: Intervalle en minutes entre les tirages de loterie / DE: Intervall in Minuten zwischen Lotterieziehungen
  draw-interval-minutes: 60

# ==[ JOBS SYSTEM CORE ]=====
jobs:
  # EN: Minimum delay between rewarded job actions in milliseconds (anti-spam / anti-bot) / TR: Meslek kazançları arasındaki minimum bekleme süresi (milisaniye, spam ve bot önleme) / FR: Délai minimum en ms entre deux actions de métier récompensées / DE: Mindestverzögerung in Millisekunden zwischen Job-Aktionen
  action-cooldown-ms: 250

# ==[ PERIODIC PAYDAY SALARY ]=====
payday:
  # EN: Fixed salary amount claimed when using /payday / TR: /payday komutu ile alınan sabit maaş miktarı / FR: Montant du salaire fixe réclamé avec /payday / DE: Fester Gehaltsbetrag bei Ausführung von /payday
  amount: 50.0
  # EN: Cooldown interval between salary claims in minutes / TR: Maaş talepleri arasındaki bekleme süresi (dakika) / FR: Intervalle d'attente en minutes entre deux salaires / DE: Wartezeit zwischen Gehaltsauszahlungen in Minuten
  interval-minutes: 60

# ==[ STOCK MARKET (BORSA) ]=====
borsa:
  # EN: Maximum percentage change applied during price fluctuations (0.05 = 5%) / TR: Fiyat dalgalanmalarında uygulanan maksimum değişim oranı (0.05 = %5) / FR: Pourcentage max de fluctuation des prix du marché (0.05 = 5%) / DE: Maximale Preisschwankung an der Börse (0.05 = 5%)
  fluctuation-rate: 0.05
  # EN: Frequency of stock price updates in seconds / TR: Borsa fiyatlarının güncellenme sıklığı (saniye cinsinden) / FR: Fréquence des fluctuations boursières en secondes / DE: Aktualisierungsintervall der Börsenkurse in Sekunden
  fluctuation-interval-seconds: 300
  # EN: Hard floor price for any ore or share / TR: Maden veya hisse senetleri için belirlenen minimum taban fiyat / FR: Prix plancher minimum pour les minerais ou actions / DE: Absoluter Mindestpreis für Erze oder Aktien
  min-price: 1.0
  # EN: Hard ceiling price for any ore or share / TR: Maden veya hisse senetleri için belirlenen maksimum tavan fiyat / FR: Prix plafond maximum pour les minerais ou actions / DE: Absoluter Höchstpreis für Erze oder Aktien
  max-price: 10000.0

# ==[ COMPANY & TAX SYSTEM ]=====
sirket:
  # EN: Cost required to establish a new player company via /company create / TR: /company create ile yeni bir şirket kurmak için gereken ücret / FR: Coût requis pour créer une entreprise avec /company create / DE: Kosten für die Gründung eines Unternehmens mit /company create
  creation-fee: 5000.0
  # EN: Periodic tax rate levied on the company vault balance / TR: Şirket kasa bakiyesinden düzenli olarak tahsil edilen vergi oranı / FR: Taux de taxe périodique sur la trésorerie de l'entreprise / DE: Regelmäßiger Steuersatz auf das Firmenkonto
  tax-rate: 0.05
  # EN: Frequency in minutes at which company taxes are calculated / TR: Şirket vergilerinin hesaplanma ve tahsilat sıklığı (dakika) / FR: Intervalle en minutes entre deux calculs fiscaux / DE: Intervall in Minuten zur Steuerberechnung
  tax-interval-minutes: 60
  # EN: Fine imposed on companies that fail to pay accumulated tax debts / TR: Vergi borcunu ödemeyen şirketlere uygulanan ceza tutarı / FR: Amende infligée aux entreprises avec des dettes fiscales impayées / DE: Strafgebühr für Unternehmen mit unbezahlten Steuerschulden
  tax-penalty: 500.0

# ==[ BANK CHECKS (ÇEK) ]=====
cek:
  # EN: Percentage fee charged when issuing a physical check / TR: Fiziksel banka çeki yazılırken kesilen komisyon yüzdesi / FR: Pourcentage de commission prélevé lors de la rédaction d'un chèque / DE: Kommissionsgebühr in Prozent beim Ausstellen eines Schecks
  commission-percent: 1.0
  # EN: Minimum monetary value allowed on a written check / TR: Çeke yazılabilecek minimum para miktarı / FR: Valeur monétaire minimale autorisée sur un chèque / DE: Mindestbetrag für einen gültigen Scheck
  min-amount: 10.0
  # EN: Maximum monetary value allowed on a written check / TR: Çeke yazılabilecek maksimum para miktarı / FR: Valeur monétaire maximale autorisée sur un chèque / DE: Höchstbetrag für einen Scheck
  max-amount: 10000000.0

# ==[ WAGER DUELS (DÜELLO) ]=====
duello:
  # EN: Server commission deducted from the duel total prize pot / TR: Düello ödül havuzundan sunucu tarafından kesilen komisyon yüzdesi / FR: Commission prélevée par le serveur sur la cagnotte du duel / DE: Serverkommission auf den gesamten Duell-Gewinnpott
  commission-percent: 2.0
  # EN: If true, a disconnected player automatically loses the duel and forfeits the bet / TR: Açık ise, düello sırasında sunucudan çıkan taraf otomatik olarak hükmen kaybeder / FR: Si vrai, le joueur déconnecté perd automatiquement le duel / DE: Bei true verliert ein getrennter Spieler das Duell automatisch
  disconnect-loss: true
  # EN: Timeout in seconds for duel invitations before they expire / TR: Gönderilen düello tekliflerinin geçerlilik süresi (saniye) / FR: Délai d'expiration des invitations de duel en secondes / DE: Ablaufzeit für Duellangebote in Sekunden


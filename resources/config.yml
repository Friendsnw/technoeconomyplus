# FR: Activez ou désactivez les modules du plugin. Leur état est affiché au démarrage.
# DE: Aktivieren oder deaktivieren Sie einzelne Module. Der Status wird beim Start ausgegeben.
features:
  # EN: Jobs module (/jobs) / TR: Meslekler modülü / FR: Module des métiers / DE: Berufe-Modul
  jobs: true
  # EN: Actionbar HUD module (/hud) / TR: Actionbar HUD modülü / FR: Module HUD actionbar / DE: Actionbar-HUD-Modul
  hud: true
  # EN: Mob health display above entities / TR: Canlıların üzerinde can göstergesi / FR: Affichage de la santé au-dessus des mobs / DE: Lebensanzeige über Mobs
  mob-health-display: true
  # EN: Trash can disposal GUI (/trash) / TR: Çöp kutusu menüsü / FR: Poubelle virtuelle / DE: Mülleimer-Menü
  trash: true
  # EN: Interactive sell GUI window (/sell) / TR: Eşya satış penceresi / FR: Fenêtre de vente interactive / DE: Interaktives Verkaufs-GUI
  sell-gui: true
  # EN: Stock market & ore fluctuations (/stock) / TR: Borsa ve maden dalgalanmaları / FR: Bourse et fluctuations / DE: Börse & Kursschwankungen
  stock: true
  # EN: Player company management & taxes (/company) / TR: Şirket yönetimi ve vergi sistemi / FR: Entreprises et fiscalité / DE: Firmenverwaltung & Steuern
  company: true
  # EN: Bank check issuing & signing (/check) / TR: Banka çeki oluşturma ve tabela arayüzü / FR: Chèques bancaires physiques / DE: Bankschecks & Schild-Eingabe
  check: true
  # EN: Player wager duels & coinflip (/duel) / TR: Bahisli 1v1 düello ve yazı-tura / FR: Duels avec paris / DE: Duell-Wettsystem
  duel: true
  # EN: Personal bank accounts & interest (/bank) / TR: Kişisel banka ve faiz sistemi / FR: Comptes bancaires personnels / DE: Bankkonten & Zinsen
  bank: true
  # EN: Daily reward streak system (/daily) / TR: Günlük giriş ödülü serisi / FR: Récompenses quotidiennes consécutives / DE: Tägliche Belohnungs-Streaks
  daily: true
  # EN: Server lottery draws (/lottery) / TR: Sunucu piyango çekilişi / FR: Loterie automatisée / DE: Server-Lotterie
  lottery: true
  # EN: Casino games & slot machines (/casino) / TR: Kumarhane ve slot makineleri / FR: Jeux de casino et machines à sous / DE: Casino & Spielautomaten
  casino: true
  # EN: Player head bounties (/bounty) / TR: Oyuncu kelle avı ödülleri / FR: Primes sur la tête des joueurs / DE: Kopfgelder auf Spieler
  bounty: true
  # EN: Auction house listings (/ah) / TR: Açık artırma pazarı / FR: Hôtel des ventes / DE: Auktionshaus
  auction: true
  # EN: Categorized server market (/market) / TR: Kategorili genel sunucu pazarı / FR: Marché par catégories / DE: Kategorisierter Markt
  market: true
  # EN: Player chest shops (/chestshop) / TR: Sandık marketleri / FR: Boutiques sur coffres / DE: Truhen-Shops
  chestshop: true
  # EN: Scheduled salary claims (/payday) / TR: Periyodik maaş sistemi / FR: Salaire périodique / DE: Regelmäßige Gehaltsauszahlung
  payday: true

# ==[ ACTIONBAR HUD SETTINGS ]=====
# EN: Settings for the persistent actionbar HUD indicator
# TR: Kalıcı actionbar HUD bilgi göstergesi ayarları
# FR: Paramètres de l'indicateur HUD sur la barre d'action
# DE: Einstellungen für die dauerhafte Actionbar-HUD-Anzeige
hud:
  # EN: Global actionbar HUD master toggle / TR: Actionbar HUD genel açma-kapama anahtarı / FR: Interrupteur général du HUD / DE: Hauptschalter für Actionbar-HUD
  enabled: true
  # EN: Display player current and max health / TR: Oyuncunun anlık ve maksimum canını göster / FR: Afficher la santé actuelle et maximale / DE: Aktuelle und maximale Gesundheit anzeigen
  show-health: true
  # EN: Display player food level / TR: Oyuncunun açlık seviyesini göster / FR: Afficher le niveau de nourriture / DE: Hungerleiste anzeigen
  show-food: true
  # EN: Display in-game world time in 24h clock / TR: Oyun içi dünya saatini 24 saat formatında göster / FR: Afficher l'heure du monde en jeu / DE: In-Game-Uhrzeit im 24h-Format anzeigen
  show-time: true
  # EN: Refresh rate of the actionbar HUD in server ticks (20 ticks = 1 second) / TR: HUD yenilenme sıklığı (20 tick = 1 saniye) / FR: Taux de rafraîchissement du HUD en ticks / DE: Aktualisierungsrate des HUDs in Ticks (20 Ticks = 1 Sekunde)
  update-interval-ticks: 20

# ==[ AUTOMATIC UPDATE CHECKER ]=====
# EN: Check for new plugin updates from plugins.teknodev.qzz.io on startup and admin login.
# TR: Sunucu açılışında ve admin girişinde plugins.teknodev.qzz.io üzerinden yeni güncellemeleri kontrol eder.
# FR: Vérifier les mises à jour du plugin au démarrage et à la connexion des administrateurs.
# DE: Beim Start und Admin-Login nach neuen Plugin-Updates auf plugins.teknodev.qzz.io suchen.
updates:
  # EN: Enable update notifications / TR: Güncelleme bildirimlerini aktifleştir / FR: Activer les notifications de mise à jour / DE: Update-Benachrichtigungen aktivieren
  check: true

# ==[ COMMAND TOGGLES ]=====
# EN: Enable or disable specific plugin commands individually across the server.
# TR: Belirli eklenti komutlarını sunucu genelinde tek tek aktifleştirin veya devre dışı bırakın.
# FR: Activer ou désactiver des commandes spécifiques du plugin sur le serveur.
# DE: Bestimmte Plugin-Befehle serverweit einzeln aktivieren oder deaktivieren.
commands:
  balance: true
  eco: true
  pay: true
  baltop: true
  bank: true
  daily: true
  bounty: true
  jobs: true
  casino: true
  coinflip: true
  lottery: true
  worth: true
  sell: true
  sellwand: true
  market: true
  shop: true
  ah: true
  chestshop: true
  payday: true
  trash: true
  hud: true
  stock: true
  company: true
  check: true
  duel: true
  clan: true
  clanadmin: true
  technoeconomyplus: true

clan:
  enabled: true
  creation:
    cost: 10000.0
    min-name-length: 3
    max-name-length: 16
    min-tag-length: 2
    max-tag-length: 6
    allow-color-codes: true
    name-blacklist: []
    tag-blacklist: []
    cooldown-seconds: 300
  limits:
    base-max-members: 10
    max-members-per-level: 2
    base-max-allies: 3
    max-allies-per-level: 1
    base-max-enemies: 5
    max-bases: 3
    base-bank-limit: 1000000.0
    bank-limit-per-level: 500000.0
  invite:
    timeout-seconds: 60
    max-pending-invites: 5
  levels:
    max-level: 50
    xp-per-level-formula: "1000 * level ^ 1.5"
    xp-sources:
      member-join: 50
      member-kill: 10
      member-death: -5
      bank-deposit-per-1000: 1
      war-win: 500
      war-lose: -100
      daily-active: 25
  war:
    enabled: true
    duration-minutes: 30
    min-members: 3
    cooldown-hours: 24
    rewards:
      winner-coins: 50000
      loser-penalty: 10000
    friendly-fire-disabled: true
  home:
    enabled: true
    cooldown-seconds: 30
    warmup-seconds: 5
    cancel-on-move: true
    cancel-on-damage: true
  bank:
    enabled: true
    tax-percent: 2.0
    withdraw-permission-rank: "CO_LEADER"
  ranks:
    hierarchy:
      - LEADER
      - CO_LEADER
      - OFFICER
      - MEMBER
      - RECRUIT
    permissions:
      LEADER: ["*"]
      CO_LEADER: ["invite", "kick", "promote_to_officer", "demote_officer", "bank_deposit", "bank_withdraw", "sethome", "setbase", "ally", "enemy", "war_declare", "war_accept", "broadcast"]
      OFFICER: ["invite", "kick_recruit", "promote_to_member", "bank_deposit", "setbase", "broadcast"]
      MEMBER: ["bank_deposit", "home", "base", "chat", "ally_chat"]
      RECRUIT: ["bank_deposit", "home", "chat"]
  recruit:
    auto-promote-hours: 72
    restricted-actions: ["bank_withdraw", "sethome", "invite"]
  chat:
    format: "&8[&6{clan_tag}&8] &7{player}&8: &f{message}"
    spy-format: "&8[SPY] [&6{clan_tag}&8] &7{player}&8: &f{message}"
    ally-format: "&8[&dALLY&8] [&6{clan_tag}&8] &7{player}&8: &f{message}"
  gui:
    enabled: true
    items:
      main-info-material: "SHIELD"
      members-material: "PLAYER_HEAD"
      bank-material: "GOLD_BLOCK"
      war-material: "DIAMOND_SWORD"
      relations-material: "BEACON"
      bases-material: "CAMPFIRE"
      top-material: "NETHER_STAR"
  top:
    page-size: 10
    update-interval-minutes: 5
  relations:
    ally-damage-disabled: true
  notifications:
    action-bar: false
    title: false
    chat: true

